<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>资产收益助手 (基金/期货)</title>
    <link rel="stylesheet" href="popup_base.css">
    <link rel="stylesheet" href="popup_components.css">
    <link rel="stylesheet" href="popup_overlay.css">
</head>

<body>
    <div class="header">
        <div class="header-logo">
            <div class="header-title-block">
                <span class="header-title">资产收益助手</span>
                <span class="header-subtitle">Portfolio Monitor</span>
            </div>
        </div>
        <div class="header-ticker-wrap">
            <div id="marketTicker" class="market-ticker" title="全局指数行情">
                <div id="marketTickerTrack" class="market-ticker-track">
                    <div class="market-ticker-copy">
                        <span class="market-ticker-empty">指数加载中...</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="header-actions">
            <button id="indexSettingsBtn" class="header-icon-btn" title="指数设置" aria-label="指数设置" type="button"><span class="header-icon-glyph">◫</span></button>
            <button id="notificationBtn" class="header-icon-btn" title="通知中心" aria-label="通知中心" type="button">
                <span class="header-icon-glyph">◉</span>
                <span id="notificationBadge" class="notification-badge" style="display: none;"></span>
            </button>
            <div id="refreshControl" class="refresh-control" title="自动刷新控件">
                <button id="refreshBtn" title="刷新行情" aria-label="刷新行情">
                    <span class="refresh-btn-inner">
                        <span id="refreshBtnIcon" class="refresh-icon">↻</span>
                        <span id="refreshBtnText" class="refresh-text">120s</span>
                    </span>
                </button>
                <span class="refresh-control-divider" aria-hidden="true"></span>
                <div id="refreshIntervalPicker" class="refresh-interval-picker">
                    <button type="button" class="refresh-interval-trigger" aria-haspopup="listbox" aria-expanded="false">
                        <span class="refresh-interval-caret">▾</span>
                    </button>
                    <div class="refresh-interval-popover" hidden role="listbox"></div>
                </div>
            </div>
            <button id="fullscreenBtn" class="header-icon-btn" title="全屏查看" aria-label="全屏查看" type="button"><span class="header-icon-glyph">⤢</span></button>
        </div>
    </div>



    <div class="fab-container">
        <div class="fab-menu" id="fabMenu">
            <button class="fab-item" id="fabSelectAll"><span class="fab-icon">✓</span><span class="fab-label">全选 /
                    取消全选</span></button>
            <button class="fab-item" id="fabAdd"><span class="fab-icon">+</span><span
                    class="fab-label">添加资产</span></button>

            <div class="fab-group" data-fab-group="batch">
                <button class="fab-item fab-group-header" type="button"><span class="fab-icon">⋯</span><span
                        class="fab-label">批量操作</span><span class="fab-chevron">▸</span></button>
                <div class="fab-submenu">
                    <button class="fab-item" id="fabOCRBatch"><span class="fab-icon">⌗</span><span
                            class="fab-label">图片识别批量添加</span></button>
                    <button class="fab-item" id="fabBatchGroup"><span class="fab-icon">#</span><span
                            class="fab-label">批量修改分组</span></button>
                    <button class="fab-item" id="fabBatchCalc"><span class="fab-icon">∑</span><span
                            class="fab-label">批量重算份额</span></button>
                    <button class="fab-item" id="fabBatchDividend"><span class="fab-icon">¥</span><span
                            class="fab-label">批量补录分红</span></button>
                    <button class="fab-item" id="fabBatchClear"><span class="fab-icon">⊘</span><span
                            class="fab-label">批量清空持仓</span></button>
                    <button class="fab-item" id="fabBatchDel"><span class="fab-icon">×</span><span
                            class="fab-label">批量删除</span></button>
                </div>
            </div>

            <div class="fab-group" data-fab-group="settlement">
                <button class="fab-item fab-group-header" type="button"><span class="fab-icon">◷</span><span
                        class="fab-label">日结算</span><span class="fab-chevron">▸</span></button>
                <div class="fab-submenu">
                    <button class="fab-item" id="fabSettlement"><span class="fab-icon">↻</span><span
                            class="fab-label">触发日结算</span></button>
                    <button class="fab-item" id="fabRollback" style="display:none;"><span class="fab-icon">↶</span><span
                            class="fab-label">撤销日结算</span></button>
                </div>
            </div>

            <div class="fab-group" data-fab-group="maintenance">
                <button class="fab-item fab-group-header" type="button"><span class="fab-icon">⌘</span><span
                        class="fab-label">数据维护</span><span class="fab-chevron">▸</span></button>
                <div class="fab-submenu">
                    <button class="fab-item" id="fabRebuildProfitHistory"><span class="fab-icon">≈</span><span
                            class="fab-label">重算收益历史</span></button>
                    <button class="fab-item" id="fabInspectOrders"><span class="fab-icon">⦿</span><span
                            class="fab-label">订单体检</span></button>
                </div>
            </div>

            <div class="fab-group" data-fab-group="io">
                <button class="fab-item fab-group-header" type="button"><span class="fab-icon">⇅</span><span
                        class="fab-label">导入导出</span><span class="fab-chevron">▸</span></button>
                <div class="fab-submenu">
                    <button class="fab-item" id="fabExport"><span class="fab-icon">↑</span><span
                            class="fab-label">导出当前数据</span></button>
                    <button class="fab-item" id="fabExportBackup"><span class="fab-icon">□</span><span
                            class="fab-label">导出备份数据</span></button>
                    <button class="fab-item" id="fabExportTradeCSV"><span class="fab-icon">≣</span><span
                            class="fab-label">导出订单CSV</span></button>
                    <button class="fab-item" id="fabImportTradeCSV"><span class="fab-icon">≡</span><span
                            class="fab-label">导入订单CSV</span></button>
                    <button class="fab-item" id="fabImport"><span class="fab-icon">↓</span><span
                            class="fab-label">导入数据</span></button>
                </div>
            </div>
        </div>
        <div class="fab-main" id="fabMain">
            <span>+</span>
        </div>
    </div>

    <!-- 统计栏 -->
    <div class="summary-bar">
        <div class="summary-item"><span class="summary-label">总资产</span><b id="totalAmount">0.00</b></div>
        <div class="summary-item"><span class="summary-label">昨日收益</span><b id="totalYesterdayProfit">0.00</b></div>
        <div class="summary-item"><span class="summary-label">当日估值</span><b id="totalTodayProfit">0.00</b></div>
        <div class="summary-item"><span class="summary-label">累计收益</span><b id="totalTotalProfit">0.00</b></div>
    </div>

    <div class="filter-bar">
        <div class="filter-left">
            <label class="filter-label">筛选分组</label>
            <div id="groupFilter" class="multi-select-filter" data-state="all">
                <button type="button" id="groupFilterTrigger" class="multi-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                    <span id="groupFilterLabel" class="multi-select-label">全部显示</span>
                    <span class="multi-select-arrow" aria-hidden="true">▾</span>
                </button>
                <div id="groupFilterPopover" class="multi-select-popover" role="listbox" aria-multiselectable="true" hidden></div>
            </div>
            <datalist id="groupList"></datalist>
        </div>
        <div id="filterBreadth" class="filter-breadth">
            <!-- 广度数据由 JS 动态渲染 -->
        </div>
        <button id="columnConfigBtn" class="filter-action-btn" title="列显示设置" aria-label="列显示设置" aria-expanded="false" type="button">☷</button>
        <div id="columnConfigPanel" role="dialog" aria-label="列显示设置"></div>
        <button id="profitCalendarBtn" class="filter-action-btn" title="收益日历" aria-label="收益日历" type="button">◷</button>
    </div>

    <!-- 所有操作按钮通过悬浮球 FAB 访问，以下为隐藏的功能性元素 -->
    <input type="file" id="importFile" accept=".json" style="display:none;">
    <input type="file" id="importTradeCsvFile" accept=".csv,text/csv" style="display:none;">
    <!-- 以下按钮隐藏，仅作 JS 绑定用（逻辑由 FAB 触发） -->
    <button id="addBtn" style="display:none;"></button>
    <button id="exportBtn" style="display:none;"></button>
    <button id="importBtn" style="display:none;"></button>
    <button id="batchGroupBtn" style="display:none;"></button>
    <button id="batchClearBtn" style="display:none;"></button>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th data-col="index">序号</th>
                    <th class="sortable" data-sort="code" data-col="code">代码</th>
                    <th data-col="name">名称/分组</th>
                    <th class="sortable" data-sort="amount" data-col="amount">持仓</th>
                    <th class="sortable col-hide" data-sort="shares" data-col="shares">份额</th>
                    <th class="sortable col-hide" data-sort="prevPrice" data-col="nav">净值</th>
                    <th class="col-hide" data-col="holdDays">持有天数</th>
                    <th class="col-hide" data-col="w1">近1周</th>
                    <th class="col-hide" data-col="m1">近1月</th>
                    <th class="col-hide" data-col="m3">近3月</th>
                    <th class="col-hide" data-col="m6">近6月</th>
                    <th class="col-hide" data-col="y1">近1年</th>
                    <th class="col-hide" data-col="ly">成立以来</th>
                    <th class="sortable" data-sort="yesterdayProfit" data-col="yesterdayProfit">昨日收益</th>
                    <th class="sortable" data-sort="todayProfit" data-col="todayProfit">估值收益</th>
                    <th class="sortable" data-sort="holdProfit" data-col="holdProfit">累计收益</th>
                    <th class="col-hide" data-col="actions">操作</th>
                </tr>
            </thead>
            <tbody id="fundTableBody"></tbody>
        </table>
    </div>

    <div id="status">
        <span id="statusText">准备就绪</span>
        <span id="selectionStatus" style="display:none;"></span>
    </div>

    <!-- Toast 容器 -->
    <div id="toastContainer"></div>

    <!-- 通用 Modal 弹窗 -->
    <div id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-box" role="document">
            <div class="modal-title" id="modalTitle">提示</div>
            <div class="modal-msg" id="modalMsg"></div>
            <input class="modal-input" id="modalInput" type="text" style="display:none;">
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- 基金详情弹窗 -->
    <div class="fund-detail-overlay" id="fundDetailOverlay">
        <div class="fund-detail-box">
            <div class="fund-detail-header">
                <div class="fund-detail-title" id="fundDetailTitle">基金详情</div>
                <div class="fund-detail-actions">
                    <div class="fund-detail-fit-btn" id="fundDetailFitBtn" title="贴合页面大小">贴合页面</div>
                    <div class="fund-detail-close" id="fundDetailClose">✕</div>
                </div>
            </div>
            <div class="fund-detail-content" id="fundDetailContent" style="position:relative;">
                <div class="detail-loading">加载中...</div>
            </div>
        </div>
    </div>

    <!-- OCR 引擎按需懒加载（tesseract-core.wasm.js / worker.min.js / tesseract.min.js） -->
    <!-- 基础共享层：提供配置、全局状态、通用工具与主 UI -->
    <script src="popup.js"></script>
    <!-- 历史数据域：提供 IndexedDB、历史净值缓存与同步 -->
    <script src="popup_history.js"></script>
    <!-- 交易域：归一化 / 显示 / 持仓快照 / 订单 CRUD / 迁移 -->
    <script src="popup_trade.js"></script>
    <!-- 分红检测 / 历史分红补录 -->
    <script src="popup_trade_dividend.js"></script>
    <!-- 结算运行时：自动结算 / 挂起调整 / 状态持久化 -->
    <script src="popup_trade_settlement.js"></script>
    <!-- 请求 / 行情接口域 -->
    <script src="popup_api.js"></script>
    <!-- 基金表格业绩缓存 / 区间涨跌幅域 -->
    <script src="popup_perf_table.js"></script>
    <!-- 业绩状态 / 缓存 / 周期配置域 -->
    <script src="popup_perf_state.js"></script>
    <!-- 业绩图表 / 详情弹窗布局域 -->
    <script src="popup_perf_chart.js"></script>
    <!-- 业绩面板 / DOM 渲染域 -->
    <script src="popup_perf_panel.js"></script>
    <!-- 基金详情弹窗数据装载域 -->
    <script src="popup_fund_detail.js"></script>
    <!-- OCR 批量录入域 -->
    <script src="popup_ocr.js"></script>
    <!-- 导入 / 导出 / 备份恢复域 -->
    <script src="popup_import_export.js"></script>
    <!-- 交易计算工具：交易日 / 份额 / 金额 / 撤销截止 -->
    <script src="popup_trade_utils.js"></script>
    <!-- 批量操作：分组 / 清仓 / 删除 / 重算份额 -->
    <script src="popup_batch_ops.js"></script>
    <!-- 交易表单：加减仓 / 历史补录 / 基金编辑器 -->
    <script src="popup_trade_form.js"></script>
    <!-- 居中弹窗菜单 / 待确认交易 / 清除订单 -->
    <script src="popup_center_menu.js"></script>
    <!-- Toast / Modal / 通知中心 -->
    <script src="popup_ui.js"></script>
    <!-- 撤销结算 / 备份管理 / 份额推导 -->
    <script src="popup_settlement_rollback.js"></script>
    <!-- 手动/自动日结算 / 状态持久化 -->
    <script src="popup_settlement_run.js"></script>
    <!-- 业绩缓存 / 状态 / 周期配置 -->
    <script src="popup_perf_cache.js"></script>
    <!-- 初始化 / 事件绑定 -->
    <script src="popup_perf_init.js"></script>
    <!-- 数据加载 / 行情刷新 -->
    <script src="popup_perf_data.js"></script>
    <!-- 表格渲染 / 选中状态 -->
    <script src="popup_perf_render.js"></script>
</body>

</html>
