<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>资产收益助手 (基金/期货)</title>
    <style>
        /* ===== 基础重置 ===== */
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            width: 580px;
            height: 550px;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #0d1b2e;
            color: #c8d8f0;
        }

        body.is-fullscreen {
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, #0d1b2e 0%, #1a2f50 100%);
            color: #e8f0ff;
            padding: 7px 12px;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #1e3a5f;
        }

        .header>span {
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-logo::before {
            content: '📈';
            font-size: 16px;
        }

        .header-actions {
            position: relative;
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
            flex-shrink: 1;
        }

        .header-icon-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.08);
            color: #a8c4e8;
            line-height: 1;
            flex-shrink: 0;
            transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.12s, box-shadow 0.2s;
        }


        .header-icon-btn:hover,
        .header-icon-btn.active {
            background: rgba(24, 144, 255, 0.25);
            color: #69b1ff;
            border-color: rgba(105, 177, 255, 0.35);
            transform: translateY(-1px);
            filter: none;
        }

        .header-icon-btn:active {
            transform: translateY(0);
        }

        .header-icon-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.25);
        }

        .refresh-control {
            --refresh-progress: 1;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 0;
            min-width: 112px;
            min-height: 28px;
            padding: 2px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .refresh-control::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(69, 196, 255, 0.22), rgba(33, 120, 255, 0.34));
            transform: scaleX(var(--refresh-progress));
            transform-origin: left center;
            transition: transform 0.35s ease, background 0.2s ease, opacity 0.2s ease;
            opacity: 0.94;
            z-index: 0;
        }

        .refresh-control:hover {
            background: rgba(24, 144, 255, 0.14);
            border-color: rgba(105, 177, 255, 0.28);
        }

        .refresh-control:focus-within {
            border-color: rgba(105, 177, 255, 0.45);
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.12);
        }

        .refresh-control.is-medium::before {
            background: linear-gradient(90deg, rgba(255, 196, 69, 0.24), rgba(255, 149, 0, 0.34));
        }

        .refresh-control.is-low::before {
            background: linear-gradient(90deg, rgba(255, 117, 117, 0.26), rgba(255, 77, 79, 0.38));
        }

        .refresh-control.is-empty::before {
            opacity: 0.28;
        }

        .refresh-control.is-refreshing::before {
            background: linear-gradient(90deg, rgba(102, 187, 255, 0.28), rgba(61, 132, 255, 0.42));
            transform: scaleX(1);
            opacity: 1;
        }

        .refresh-control-divider {
            position: relative;
            z-index: 1;
            width: 1px;
            height: 16px;
            background: rgba(120, 158, 199, 0.28);
            margin: 0 2px;
            flex-shrink: 0;
            transition: background 0.2s, opacity 0.2s;
        }

        .refresh-interval-select {
            position: relative;
            z-index: 1;
            width: 18px;
            min-width: 18px;
            height: 26px;
            padding: 0;
            border: none;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            color: transparent;
            background: transparent;
            box-shadow: none;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
            cursor: pointer;
            transition: opacity 0.2s;
            text-indent: -999px;
            background-image: linear-gradient(45deg, transparent 50%, #7fb7ff 50%), linear-gradient(135deg, #7fb7ff 50%, transparent 50%);
            background-position: calc(50% - 3px) calc(50% - 1px), calc(50% + 2px) calc(50% - 1px);
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }

        .refresh-interval-select:hover {
            opacity: 0.85;
        }

        .refresh-interval-select:focus {
            box-shadow: none;
        }

        .refresh-interval-select option {
            color: #c8d8f0;
            font-size: 12px;
            text-indent: 0;
        }

        .refresh-interval-select:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        body.is-fullscreen .refresh-control {
            min-width: 80px;
        }

        @media (max-width: 640px) {
            .refresh-control {
                min-width: 114px;
            }
        }

        #refreshBtn {
            position: relative;
            z-index: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            flex: 1 1 auto;
            min-width: 0;
            height: 26px;
            background: transparent;
            border: none;
            color: #dcecff;
            padding: 0 10px 0 12px;
            border-radius: 999px;
            line-height: 1;
            transition: color 0.2s;
        }

        #refreshBtn:hover {
            color: #f2f8ff;
        }

        #refreshBtn:focus-visible {
            outline: none;
        }

        .refresh-btn-inner {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            gap: 5px;
            min-width: 0;
        }

        body.is-fullscreen #refreshBtn {
            padding-left: 13px;
        }

        @media (max-width: 640px) {
            #refreshBtn {
                padding: 0 9px 0 11px;
            }
        }

        #refreshBtn.spinning .refresh-btn-inner {
            animation: pulseGlow 1s ease-in-out infinite;
        }

        #refreshBtn .refresh-text {
            display: inline-block;
        }

        #refreshBtn .refresh-text:empty {
            display: none;
        }

        #refreshBtn .refresh-text,
        #refreshBtn .refresh-icon {
            position: relative;
            z-index: 1;
        }

        #refreshBtn .refresh-text {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        #refreshBtn .refresh-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        #refreshBtn.spinning .refresh-icon {
            animation: spin 0.8s linear infinite;
        }

        .refresh-control>* {
            position: relative;
            z-index: 1;
        }

        .refresh-control .refresh-interval-select {
            padding-left: 0;
        }

        .refresh-control-divider {
            margin-left: 1px;
        }

        .refresh-control.is-disabled #refreshBtn,
        .refresh-control.is-disabled .refresh-interval-select {
            cursor: wait;
        }

        .refresh-control.is-refreshing #refreshBtn {
            color: #e9f4ff;
        }

        .refresh-control.is-refreshing .refresh-interval-select {
            opacity: 0.88;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.72;
            }
        }

        .market-ticker {
            display: flex;
            align-items: center;
            min-width: 0;
            flex: 1 1 220px;
            background: transparent;
            border: none;
            padding: 0;
            overflow: hidden;
        }

        .market-ticker-track {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            min-width: 0;
            overflow: hidden;
        }

        .market-ticker-copy {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: default;
        }

        .market-ticker-copy:hover {
            animation-play-state: paused !important;
        }

        .market-ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.15px;
            flex-shrink: 0;
        }

        .market-ticker-label {
            color: #86a9cf;
            white-space: nowrap;
        }

        .market-ticker-value {
            color: #d8eaff;
            font-variant-numeric: tabular-nums;
        }

        .market-ticker-item.is-up .market-ticker-value,
        .market-ticker-item.is-limit-up .market-ticker-value {
            color: #ff6b72;
        }

        .market-ticker-item.is-down .market-ticker-value,
        .market-ticker-item.is-limit-down .market-ticker-value {
            color: #4dd38a;
        }

        .market-ticker-empty {
            font-size: 11px;
            color: #7f9ab9;
            font-weight: 600;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .market-ticker-item.is-index .market-ticker-label {
            color: #a0b8d8;
        }

        .index-settings-btn {
            flex-shrink: 0;
            background: none;
            border: none;
            color: #7f9ab9;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            line-height: 1;
            transition: color 0.15s, background 0.15s;
        }

        .index-settings-btn:hover {
            color: #d8eaff;
            background: rgba(255, 255, 255, 0.07);
        }

        /* ===== 指数设置面板 ===== */
        .index-settings-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            color: #d8eaff;
            height: 420px;
            min-height: 0;
        }

        /* 左栏：已添加 */
        .index-settings-left {
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            padding-right: 16px;
            min-height: 0;
        }

        /* 右栏：可选 */
        .index-settings-right {
            display: flex;
            flex-direction: column;
            padding-left: 16px;
            min-height: 0;
        }

        .index-settings-col-title {
            font-size: 11px;
            font-weight: 700;
            color: #4a6a90;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        /* 已选列表 */
        .index-settings-selected-grid {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1px;
            overflow-y: auto;
            min-height: 0;
        }

        .index-settings-selected-grid::-webkit-scrollbar {
            width: 3px;
        }

        .index-settings-selected-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .index-settings-selected-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
        }

        .index-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 6px 7px 8px;
            border-radius: 6px;
            cursor: grab;
            transition: background 0.15s;
            border: 1px solid transparent;
            user-select: none;
        }

        .index-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.07);
        }

        .index-card.dragging {
            opacity: 0.4;
            cursor: grabbing;
        }

        .index-card.drag-over {
            border-top: 2px solid rgba(0, 153, 255, 0.6);
        }

        .index-card-drag-handle {
            color: rgba(255, 255, 255, 0.18);
            font-size: 11px;
            letter-spacing: -1px;
            flex-shrink: 0;
            line-height: 1;
        }

        .index-card-title {
            font-size: 12px;
            color: #c8d8f0;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }

        .index-card-price {
            font-size: 12px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 60px;
            text-align: right;
        }

        .index-card-rate {
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            min-width: 52px;
            text-align: right;
        }

        .index-card-remove {
            font-size: 13px;
            color: rgba(255, 77, 79, 0.4);
            cursor: pointer;
            flex-shrink: 0;
            width: 18px;
            text-align: center;
            transition: color 0.15s;
            line-height: 1;
        }

        .index-card-remove:hover {
            color: #ff4d4f;
        }

        .index-card-up .index-card-price,
        .index-card-up .index-card-rate {
            color: #ff6168;
        }

        .index-card-down .index-card-price,
        .index-card-down .index-card-rate {
            color: #4dd38a;
        }

        .index-card-none .index-card-price,
        .index-card-none .index-card-rate {
            color: #4a6a90;
        }

        .index-settings-empty {
            padding: 24px 0;
            text-align: center;
            color: #3a5a7a;
            font-size: 12px;
        }

        /* 右栏：分组可选 */
        .index-settings-all-list {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .index-settings-all-list::-webkit-scrollbar {
            width: 3px;
        }

        .index-settings-all-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .index-settings-all-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
        }

        .index-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .index-group-label {
            font-size: 10px;
            font-weight: 700;
            color: #3a5a7a;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .index-group-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .index-tag-item {
            padding: 4px 9px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 4px;
            font-size: 11px;
            color: #7f9ab9;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .index-tag-item:hover {
            background: rgba(255, 255, 255, 0.09);
            color: #d8eaff;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .index-tag-item.active {
            background: rgba(0, 153, 255, 0.12);
            border-color: rgba(0, 153, 255, 0.35);
            color: #4ab0ff;
        }

        .index-tag-item.active:hover {
            background: rgba(0, 153, 255, 0.18);
        }

        #modalOverlay[data-mode="index-settings"] .modal-box {
            max-width: 640px;
            width: 92%;
        }

        #modalOverlay[data-mode="index-settings"] .modal-msg {
            margin-bottom: 0;
            padding: 0;
        }

        .index-settings-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .index-settings-row input[type=checkbox] {
            accent-color: #1890ff;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .index-settings-code {
            margin-left: auto;
            font-size: 11px;
            color: #7f9ab9;
            font-variant-numeric: tabular-nums;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        #fullscreenBtn {
            font-size: 15px;
        }

        .refresh-control:has(#refreshBtn.spinning) {
            border-color: rgba(105, 177, 255, 0.35);
            background: rgba(24, 144, 255, 0.16);
        }

        .refresh-control:has(#refreshBtn.spinning) .refresh-control-divider {
            background: rgba(120, 183, 255, 0.4);
        }

        .refresh-control:has(#refreshBtn.spinning) .refresh-interval-select,
        .refresh-control:has(#refreshBtn.spinning) #refreshBtn {
            color: #8ec5ff;
        }

        @supports not selector(:has(*)) {
            .refresh-control.is-refreshing {
                border-color: rgba(105, 177, 255, 0.35);
                background: rgba(24, 144, 255, 0.16);
            }

            .refresh-control.is-refreshing .refresh-control-divider {
                background: rgba(120, 183, 255, 0.4);
            }

            .refresh-control.is-refreshing .refresh-interval-select,
            .refresh-control.is-refreshing #refreshBtn {
                color: #8ec5ff;
            }
        }

        .refresh-control.is-disabled {
            opacity: 0.85;
        }

        input,
        select {
            padding: 6px 8px;
            background: #0d1b2e;
            border: 1px solid #2a4a72;
            border-radius: 6px;
            font-size: 12px;
            color: #c8d8f0;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: #4a6a90;
        }

        input:focus,
        select:focus {
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.15);
        }

        select option {
            background: #0d1b2e;
        }

        button {
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            transition: filter 0.15s, transform 0.1s;
        }

        button:hover {
            filter: brightness(1.15);
        }

        button:active {
            transform: scale(0.96);
        }

        /* ===== 统计栏 ===== */
        .summary-bar {
            background: linear-gradient(180deg, rgba(17, 31, 53, 0.96), rgba(14, 26, 44, 0.96));
            padding: 7px 12px;
            display: flex;
            align-items: stretch;
            gap: 6px;
            border-bottom: 1px solid #1e3a5f;
            font-size: 11px;
            color: #6a8aaa;
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }

        .summary-item {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
            padding: 3px 6px;
            border-radius: 8px;
            background: rgba(9, 21, 36, 0.32);
            border: 1px solid rgba(30, 58, 95, 0.42);
            text-align: center;
            line-height: 1.25;
        }

        .summary-label {
            max-width: 100%;
            font-size: 10px;
            color: #6f8fb3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.15;
        }

        .summary-item b {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.25px;
            font-variant-numeric: tabular-nums;
            color: #d8eaff;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .summary-item b.up {
            color: #f5222d;
        }

        .summary-item b.down {
            color: #39b56e;
        }

        /* ===== 筛选栏 ===== */
        .filter-bar {
            padding: 5px 10px;
            background: linear-gradient(180deg, rgba(15, 31, 52, 0.98), rgba(13, 27, 46, 0.98));
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            border-bottom: 1px solid #1e3a5f;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }

        .filter-left {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex: 0 1 auto;
        }

        .filter-left select {
            min-width: 0;
            width: 124px;
            max-width: 100%;
            flex: 0 1 124px;
        }

        .header-ticker-wrap {
            display: flex;
            align-items: center;
            flex: 1 1 0;
            min-width: 0;
            overflow: hidden;
            gap: 4px;
            padding: 0 8px;
        }

        .header-ticker-wrap .market-ticker {
            flex: 1 1 0;
            min-width: 0;
            max-width: 100%;
            justify-content: flex-start;
        }

        .header-ticker-wrap .market-ticker-track {
            justify-content: flex-start;
            overflow: hidden;
        }

        .header-ticker-wrap .market-ticker-copy {
            display: flex;
            align-items: center;
            width: max-content;
            gap: 32px;
            padding-right: 32px;
        }

        .header-ticker-wrap .market-ticker-copy.is-animating {
            animation: ticker-scroll 30s linear infinite;
        }

        .header-ticker-wrap .market-ticker-item {
            font-size: 11px;
            gap: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        /* 统一着色：红涨绿跌 */
        .market-ticker-item.is-up {
            color: #ff5252 !important;
            font-weight: 500;
        }

        .market-ticker-item.is-down {
            color: #2ecc71 !important;
            font-weight: 500;
        }

        .market-ticker-item .market-ticker-price,
        .market-ticker-item .market-ticker-change,
        .market-ticker-item .market-ticker-value {
            font-weight: 600;
        }

        .market-ticker-mv {
            opacity: 0.7;
            font-size: 10px;
            margin-left: 2px;
        }

        @keyframes ticker-scroll {
            from {
                transform: translateX(0);
            }

        /* ===== 表格容器 ===== */
        .table-container {
            flex: 1;
            overflow-y: auto;
            background: #0d1b2e;
            padding-bottom: 78px;
            box-sizing: border-box;
        }


        /* 滚动条美化 */
        .table-container::-webkit-scrollbar {
            width: 5px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #0d1b2e;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #2a4a72;
            border-radius: 3px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        th {
            background: #111f35;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 500;
            font-size: 11px;
            color: #4a6a90;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #1e3a5f;
            padding-top: 7px;
            padding-bottom: 7px;
        }

        th,
        td {
            padding: 7px 6px;
            text-align: left;
            border-bottom: 1px solid #141f30;
            font-size: 12px;
            line-height: 1.32;
        }

        th[data-col="amount"],
        th[data-col="shares"],
        th[data-col="nav"],
        th[data-col="holdDays"],
        th[data-col="w1"],
        th[data-col="m1"],
        th[data-col="m3"],
        th[data-col="m6"],
        th[data-col="y1"],
        th[data-col="ly"],
        th[data-col="yesterdayProfit"],
        th[data-col="todayProfit"],
        th[data-col="holdProfit"],
        td[data-col="amount"],
        td[data-col="shares"],
        td[data-col="nav"],
        td[data-col="holdDays"],
        td[data-col="w1"],
        td[data-col="m1"],
        td[data-col="m3"],
        td[data-col="m6"],
        td[data-col="y1"],
        td[data-col="ly"],
        td[data-col="yesterdayProfit"],
        td[data-col="todayProfit"],
        td[data-col="holdProfit"] {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        td[data-col="amount"] .cell-with-icon,
        td[data-col="shares"] .cell-with-icon {
            justify-content: flex-end;
        }

        tbody tr {
            transition: background-color 0.15s, box-shadow 0.15s;
        }

        tbody tr:hover {
            background: rgba(24, 144, 255, 0.06);
        }

        /* ===== 涨跌色 ===== */
        .up {
            color: #f5222d;
            font-weight: 700;
        }

        .down {
            color: #39b56e;
            font-weight: 700;
        }

        /* ===== 标签/名称 ===== */
        .group-tag {
            font-size: 10px;
            color: #4a6a90;
            background: #1a2f50;
            padding: 1px 5px;
            border-radius: 3px;
            cursor: pointer;
            display: inline-block;
            margin-top: 2px;
            border: 1px solid #2a4a72;
            transition: border-color 0.15s;
        }

        .group-tag:hover {
            border-color: #1890ff;
            color: #69b1ff;
        }

        .fund-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            max-width: 140px;
            color: #c8d8f0;
        }

        .dividend-badge {
            font-size: 10px;
            color: #fff;
            background: #fa8c16;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-left: 6px;
            border: 1px solid #ff9c6e;
            font-weight: 600;
            animation: pulse 2s ease-in-out infinite;
        }

        .buy-badge {
            font-size: 10px;
            color: #fff;
            background: #f5222d;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-left: 6px;
            border: 1px solid #ff7875;
            font-weight: 600;
            animation: pulse 2s ease-in-out infinite;
        }

        .sell-badge {
            font-size: 10px;
            color: #fff;
            background: #39b56e;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-left: 6px;
            border: 1px solid #73d13d;
            font-weight: 600;
            animation: pulse 2s ease-in-out infinite;
        }

        /* ===== 置顶图钉按钮 ===== */
        .pin-btn {
            display: inline-block;
            margin-left: 5px;
            font-size: 11px;
            cursor: pointer;
            opacity: 0.22;
            vertical-align: middle;
            transition: opacity 0.18s, transform 0.18s;
            user-select: none;
            line-height: 1;
        }

        .pin-btn:hover {
            opacity: 0.7;
            transform: scale(1.15);
        }

        /* 已置顶状态：高亮显示 */
        .pin-btn.is-pinned {
            opacity: 1;
            filter: drop-shadow(0 0 3px rgba(255, 215, 0, 0.8));
        }

        /* 置顶行样式：左侧金色边框 + 轻微背景 */
        tbody tr.pinned-row {
            background: rgba(255, 215, 0, 0.04);
            box-shadow: inset 2px 0 0 rgba(255, 215, 0, 0.55);
        }

        tbody tr.pinned-row:hover {
            background: rgba(255, 215, 0, 0.08);
        }

        /* 置顶区域底部加一条分隔线（当有非置顶行时） */
        tbody tr.pinned-row:not(:has(+ tr.pinned-row)):not(:last-child) {
            border-bottom: 1px dashed rgba(255, 215, 0, 0.25);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* 份额列（小窗口隐藏） */
        .sortable {
            cursor: pointer;
            user-select: none;
        }

        .sortable:hover {
            color: #69b1ff;
        }

        .del-btn {
            color: #cf4444;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 13px;
            padding: 3px 5px;
            transition: color 0.15s;
        }

        .del-btn:hover {
            color: #ff6b6b;
        }

        /* ===== 状态栏 ===== */
        #status {
            padding: 5px 12px;
            font-size: 11px;
            color: #3a5a82;
            background: #0a1525;
            border-top: 1px solid #1e3a5f;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            min-height: 30px;
            box-sizing: border-box;
        }

        #statusText,
        #selectionStatus {
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #statusText {
            flex: 0 1 180px;
        }

        #selectionStatus {
            flex: 0 1 160px;
            text-align: center;
        }


        /* ===== Toast ===== */
        #toastContainer {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }

        .toast {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(10px);
            animation: toastIn 0.25s ease forwards;
            pointer-events: none;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .toast.fade-out {
            animation: toastOut 0.3s ease forwards;
        }

        .toast.info {
            background: rgba(24, 144, 255, 0.9);
        }

        .toast.success {
            background: rgba(46, 164, 79, 0.9);
        }

        .toast.warning {
            background: rgba(224, 123, 0, 0.9);
        }

        .toast.error {
            background: rgba(207, 68, 68, 0.9);
        }

        @keyframes toastIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateY(-8px);
            }
        }

            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);

            padding-bottom: 10px;
            border-bottom: 1px solid #1e3a5f;

        /* 表单里的"全部"按钮 */
        .all-btn {
            background: #1a2f50;
            border: 1px solid #2a4a72;
            color: #8aacce;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .all-btn:hover {
            background: #2a4a72;
            color: #c8d8f0;
        }

        /* 下单时间切换器 */
        .timing-switcher {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            align-items: center;
        }

        .timing-switcher span {
            font-size: 11px;
            color: #8aacce;
            flex-shrink: 0;
        }

        .timing-btn {
            cursor: pointer;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            border: 1px solid #2a4a72;
            background: transparent;
            color: #8aacce;
            transition: all 0.15s;
        }

        .timing-btn.active-before {
            background: #1890ff;
            color: #fff;
            border-color: #1890ff;
        }

        .timing-btn.active-after {
            background: #fa8c16;
            color: #fff;
            border-color: #fa8c16;
        }

        /* 交易记录列表 */
        .tx-list {
            max-height: 320px;
            overflow-y: auto;
            margin: -4px 0;
        }

        .tx-item {
            padding: 10px 0;
            border-bottom: 1px solid #1e3a5f;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tx-item:last-child {
            border-bottom: none;
        }

        .tx-row-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .tx-row-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tx-type {
            font-size: 12px;
            font-weight: 700;
        }

        .tx-type.add {
            color: #ff7875;
        }

        .tx-type.remove {
            color: #73d13d;
        }

        .tx-type.dividend {
            color: #ffc53d;
        }

        .tx-amount {
            font-size: 12px;
            color: #c8d8f0;
        }

        .tx-amount b.add {
            color: #ff7875;
        }

        .tx-amount b.remove {
            color: #73d13d;
        }

        .tx-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 8px;
            color: #fff;
        }

        .tx-badge.pending {
            background: #fa8c16;
        }

        .tx-badge.confirmed {
            background: #2ea44f;
        }

        .tx-nav {
            font-size: 11px;
            color: #6a8aaa;
        }

        .tx-date {
            font-size: 10px;
            color: #3a5a82;
        }

        .tx-revoke-btn {
            background: none;
            border: 1px solid #cf4444;
            color: #cf4444;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .tx-revoke-btn:hover {
            background: rgba(207, 68, 68, 0.12);
        }

        .tx-no-revoke {
            font-size: 11px;
            color: #3a5a82;
        }

        .cell-with-icon {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        /* ===== 设置齿轮图标 ===== */
        .settings-icon {
            margin-left: 8px;
            cursor: pointer;
            opacity: 0.4;
            font-size: 14px;
            transition: opacity 0.2s, transform 0.2s;
            display: inline-block;
            user-select: none;
        }

        .settings-icon:hover {
            opacity: 1;
            transform: rotate(45deg);
        }

        /* ===== 上下文菜单 ===== */
        .context-menu {
            position: fixed;
            background: #1a2f50;
            border: 1px solid #2a4a72;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            z-index: 20000;
            min-width: 130px;
            padding: 6px 0;
            display: none;
            overflow: hidden;
        }

        /* ===== 居中操作弹窗样式 ===== */
        /* 背景遮罩：虚化效果 */
        .center-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 10001;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .center-modal-overlay.visible {
            display: flex;
        }

        .center-modal-box {
            width: 320px;
            background: #111f35;
            border: 1px solid #2a4a72;
            border-radius: 12px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            font-family: -apple-system, "PingFang SC", sans-serif;
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

        .center-modal-overlay.visible .center-modal-box {
            transform: scale(1);
            opacity: 1;
        }

        .center-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid #1e3a5f;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 700;
            color: #e8f0ff;
        }

        .modal-link {
            font-size: 12px;
            color: #69b1ff;
            cursor: pointer;
            text-decoration: none;
        }

        .modal-link:hover {
            color: #91caff;
        }

        .center-modal-info {
            padding: 14px 18px;
            text-align: center;
            border-bottom: 1px solid #1e3a5f;
            background: #0d1b2e;
        }

        .info-name {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #c8d8f0;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-code {
            font-size: 11px;
            color: #4a6a90;
        }

        .center-modal-actions {
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-row-double {
            display: flex;
            gap: 8px;
        }

        .btn-op {
            flex: 1;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-op.add {
            background: rgba(245, 34, 45, 0.12);
            color: #ff7875;
            border-color: rgba(245, 34, 45, 0.3);
        }

        .btn-op.add:hover {
            background: rgba(245, 34, 45, 0.22);
        }

        .btn-op.remove {
            background: rgba(57, 181, 110, 0.12);
            color: #73d13d;
            border-color: rgba(57, 181, 110, 0.3);
        }

        .btn-op.remove:hover {
            background: rgba(57, 181, 110, 0.22);
        }

        .btn-op.dividend {
            background: rgba(250, 140, 22, 0.12);
            color: #ffc53d;
            border-color: rgba(250, 140, 22, 0.3);
        }

        .btn-op.dividend:hover {
            background: rgba(250, 140, 22, 0.22);
        }

        .btn-op.edit {
            background: rgba(24, 144, 255, 0.12);
            color: #69b1ff;
            border-color: rgba(24, 144, 255, 0.3);
        }

        .btn-op.edit:hover {
            background: rgba(24, 144, 255, 0.22);
        }

        .btn-op.calc {
            background: rgba(212, 136, 6, 0.12);
            color: #ffc53d;
            border-color: rgba(212, 136, 6, 0.3);
        }

        .btn-op.calc:hover {
            background: rgba(212, 136, 6, 0.22);
        }

        .btn-op.clear {
            background: rgba(207, 68, 68, 0.08);
            color: #ff9c9c;
            border-color: rgba(207, 68, 68, 0.2);
        }

        .btn-op.clear:hover {
            background: rgba(207, 68, 68, 0.18);
        }

        .btn-op.delete {
            background: transparent;
            color: #cf4444;
            border-color: transparent;
        }

        .btn-op.delete:hover {
            background: rgba(207, 68, 68, 0.12);
            border-color: rgba(207, 68, 68, 0.2);
        }

        /* ===== 基金详情弹窗（深色主题） ===== */
        .fund-detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 10002;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .fund-detail-overlay.visible {
            display: flex;
        }

        .fund-detail-box {
            width: 92%;
            max-width: 800px;
            max-height: min(88vh, 760px);
            background: #0a1525;
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .fund-detail-box.fit-page {
            width: calc(100vw - 24px);
            max-width: 1400px;
            max-height: calc(100vh - 24px);
        }

        .fund-detail-header {
            padding: 16px 20px;
            background: #111f35;
            border-bottom: 1px solid #1e3a5f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fund-detail-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .fund-detail-fit-btn {
            cursor: pointer;
            font-size: 12px;
            color: #8aacce;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid #2a4a72;
            background: rgba(13, 27, 46, 0.85);
            transition: all 0.2s;
            user-select: none;
        }

        .fund-detail-fit-btn:hover {
            color: #e8f0ff;
            border-color: #4b78a8;
            background: rgba(24, 144, 255, 0.12);
        }

        .fund-detail-title {
            font-size: 16px;
            font-weight: 600;
            color: #e8f0ff;
        }

        .fund-detail-close {
            cursor: pointer;
            font-size: 20px;
            color: #6a8aaa;
            transition: color 0.2s;
            line-height: 1;
        }

        .fund-detail-close:hover {
            color: #c8d8f0;
        }

        .fund-detail-content {
            flex: 1;
            overflow-y: auto;
            background: #0d1b2e;
        }

        .fund-detail-content::-webkit-scrollbar {
            width: 6px;
        }

        .fund-detail-content::-webkit-scrollbar-track {
            background: #0d1b2e;
        }

        .fund-detail-content::-webkit-scrollbar-thumb {
            background: #2a4a72;
            border-radius: 3px;
        }

        .detail-info-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .detail-info-label {
            font-size: 11px;
            color: #4a6a90;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-info-value {
            font-size: 15px;
            font-weight: 700;
            color: #e8f0ff;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        .detail-info-value.bold {
            font-size: 18px;
        }

        .detail-info-value.hero {
            font-size: 24px;
            color: #69b1ff;
        }

        /* 估值时间小框 */
        .estimation-box {
            background: rgba(26, 47, 80, 0.4);
            border: 1px solid #1e3a5f;
            border-radius: 6px;
            padding: 8px 12px;
            text-align: right;
            margin-bottom: 20px;
        }

        .estimation-label {
            font-size: 10px;
            color: #4a6a90;
            margin-bottom: 2px;
        }

        .estimation-time {
            font-size: 12px;
            color: #c8d8f0;
            font-weight: 700;
        }

        /* 两列股票网格 */
        .holdings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px 0;
        }

        .holding-card {
            background: rgba(13, 27, 46, 0.5);
            border: 1px solid #1e3a5f;
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .holding-card:hover {
            border-color: #2a4a72;
        }

        .holding-card-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 55%;
        }

        .holding-card-name {
            font-size: 13px;
            color: #c8d8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .holding-card-badge {
            font-size: 11px;
            color: #3b6697;
            font-weight: 600;
        }

        .holding-card-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .holding-card-rate {
            font-size: 12px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
            min-width: 50px;
            text-align: center;
        }

        .holding-card-rate.up {
            background: rgba(245, 34, 45, 0.1);
            color: #ff7875;
        }

        .holding-card-rate.down {
            background: rgba(57, 181, 110, 0.1);
            color: #73d13d;
        }

        .holding-card-percent {
            font-size: 12px;
            color: #69b1ff;
            font-weight: 600;
        }

        /* 面积图渐变背景 */
        .detail-chart-section {
            background: #0a1525;
            margin: 0;
            padding: 0 16px 24px;
        }

        .detail-loading {
            text-align: center;
            color: #4a6a90;
            font-size: 13px;
            padding: 40px 0;
        }

        /* 补全 Tab 切换按钮样式 */
        .detail-tabs {
            display: flex;
            background: #0d1b2e;
            border-bottom: 1px solid #1e3a5f;
            border-top: 1px solid #1e3a5f;
            margin-bottom: 0px;
        }

        .detail-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: #4a6a90;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-weight: 600;
        }

        .detail-tab.active {
            color: #69b1ff;
            background: rgba(24, 144, 255, 0.05);
            border-bottom-color: #1890ff;
        }

        .detail-tab:hover:not(.active) {
            color: #c8d8f0;
            background: rgba(255, 255, 255, 0.02);
        }

        .detail-tab-content {
            display: none;
            background: #111f35;
            padding: 18px 16px 24px;
        }

        .detail-tab-content.active {
            display: block;
        }

        .perf-nav-section {
            margin-top: 14px;
            padding: 12px 14px;
            border: 1px solid #1e3a5f;
            border-radius: 10px;
            background: rgba(13, 27, 46, 0.55);
        }

        .perf-nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .perf-nav-title {
            font-size: 13px;
            font-weight: 600;
            color: #c8d8f0;
        }

        .perf-nav-preview,
        .perf-nav-modal-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .perf-nav-modal-list {
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .perf-nav-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 10px;
            border: 1px solid rgba(30, 58, 95, 0.9);
            border-radius: 8px;
            background: rgba(17, 31, 53, 0.9);
        }

        .perf-nav-row.full {
            padding: 9px 12px;
        }

        .perf-nav-date {
            font-size: 12px;
            color: #8aacce;
        }

        .perf-nav-price {
            font-size: 13px;
            font-weight: 700;
            color: #e8f0ff;
        }

        .perf-nav-empty {
            padding: 14px 0;
            text-align: center;
            font-size: 12px;
            color: #4a6a90;
        }

        .detail-error {
            text-align: center;
            color: #ff7875;
            font-size: 13px;
            padding: 40px 0;
        }

        /* 悬浮球容器 */
        .fab-container {
            position: fixed;
            bottom: 40px;
            right: 18px;
            z-index: 999;
        }

        body.is-fullscreen .fab-container {
            bottom: 28px;
            right: 22px;
        }

        /* 主球体 */
        .fab-main {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #1890ff 0%, #3aa0ff 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .fab-main:hover {
            transform: translateY(-1px) scale(1.04);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
        }

        .fab-main.active {
            transform: scale(1.04);
            filter: brightness(1.06);
            box-shadow: 0 10px 30px rgba(24, 144, 255, 0.28);
        }

        /* 菜单项 */
        .fab-menu {
            position: absolute;
            bottom: 66px;
            right: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 210px;
            padding: 10px;
            background: linear-gradient(180deg, rgba(12, 28, 48, 0.96) 0%, rgba(8, 20, 35, 0.94) 100%);
            border: 1px solid rgba(72, 110, 154, 0.56);
            border-radius: 18px;
            box-shadow: 0 16px 38px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            pointer-events: none;
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            transform-origin: bottom right;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .fab-menu.show {
            pointer-events: auto;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .fab-item {
            min-height: 40px;
            width: 100%;
            white-space: nowrap;
            background: linear-gradient(180deg, #132742 0%, #0f2037 100%);
            border: 1px solid #28496f;
            padding: 9px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            color: #d2e3fb;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
            transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            text-align: left;

        .fab-item:hover {

            border-color: #3a7fbd;
            transform: translateX(-2px);
        }

        .fab-item .fab-icon {
            width: 18px;
            text-align: center;
            flex-shrink: 0;
        }

        .fab-item .fab-label {
            flex: 1;
        }

        tr.selected-row {
            background-color: rgba(24, 144, 255, 0.2) !important;
            outline: 1px solid rgba(24, 144, 255, 0.45);
            box-shadow: inset 0 0 0 1px rgba(105, 177, 255, 0.22);
        }

        #fundTableBody tr {
            cursor: pointer;
            transition: background-color 0.15s, box-shadow 0.15s;
            user-select: none;
            /* 禁止行内文字被选中 */
        }

        #fundTableBody tr:hover:not(.selected-row) {
            background-color: rgba(24, 144, 255, 0.07);
            box-shadow: inset 0 0 0 1px rgba(105, 177, 255, 0.16);
        }

        #columnConfigBtn {
            font-size: 15px;
        }

        #columnConfigPanel {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 220px;
            max-height: min(420px, 70vh);
            overflow-y: auto;
            background: rgba(13, 27, 46, 0.98);
            border: 1px solid #1e3a5f;
            border-radius: 10px;
            padding: 8px;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
            z-index: 60;
            display: none;
        }

        #columnConfigPanel.open {
            display: block;
        }

        .column-config-title {
            font-size: 11px;
            color: #8fb3db;
            margin: 2px 4px 8px;
            letter-spacing: 0.2px;
        }

        .column-config-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 8px;
            border-radius: 7px;
            color: #c8d8f0;
            font-size: 12px;
            transition: background 0.15s;
        }

        .column-config-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .column-config-item.is-disabled {

        }

        .column-config-item-left {

            align-items: center;
            gap: 6px;

        .column-config-hint {
            font-size: 10px;
            color: #6f8fb5;
            white-space: nowrap;
        }

        .column-config-item input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #1890ff;
            cursor: pointer;
            margin: 0;
            flex-shrink: 0;

        .column-config-item input[type="checkbox"]:disabled {
            cursor: not-allowed;
        }

        .col-user-hidden {
            display: none !important;
        }


        #notificationBtn {
            font-size: 15px;
        }

        .notification-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 10px;
            background: #ff4d4f;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            border: 1px solid rgba(13, 27, 46, 0.9);
            box-sizing: border-box;
            pointer-events: none;
        }

        .notification-list {
            max-height: 400px;
            overflow-y: auto;
            margin: -14px 0 -14px 0;
            line-height: 1;
        }

        .notification-item {
            padding: 6px 0;
            border-bottom: 1px solid #1e3a5f;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .notification-item:last-child {
            border-bottom: none;
        }

        .notification-header {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .notification-type {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            color: #fff;
            flex-shrink: 0;
        }

        .notification-type.info {
            background: #1890ff;
        }

        .notification-type.success {
            background: #2ea44f;
        }

        .notification-type.warning {
            background: #fa8c16;
        }

        .notification-type.error {
            background: #cf4444;
        }

        .notification-time {
            font-size: 10px;
            color: #4a6a90;
            margin-left: auto;
        }

        .notification-message {
            font-size: 12px;
            color: #c8d8f0;
            line-height: 1.4;
            padding-left: 2px;
        }

        .notification-empty {
            text-align: center;
            padding: 40px 20px;
            color: #4a6a90;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="header">
        <span>资产收益助手</span>
        <div class="header-ticker-wrap">
            <div id="marketTicker" class="market-ticker" title="全局指数行情">
                <div id="marketTickerTrack" class="market-ticker-track">
                    <div class="market-ticker-copy">
                        <span class="market-ticker-empty">指数加载中...</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="header-actions">
            <button id="notificationBtn" class="header-icon-btn" title="通知中心" aria-label="通知中心" type="button">
                🔔
                <span id="notificationBadge" class="notification-badge" style="display: none;"></span>
            </button>
            <div id="refreshControl" class="refresh-control" title="自动刷新控件">
                <button id="refreshBtn" title="刷新行情" aria-label="刷新行情">
                    <span class="refresh-btn-inner">
                        <span id="refreshBtnIcon" class="refresh-icon">🔄</span>
                        <span id="refreshBtnText" class="refresh-text">120s</span>
                    </span>
                </button>
                <span class="refresh-control-divider" aria-hidden="true"></span>
                <select id="refreshIntervalSelect" class="refresh-interval-select" title="自动刷新间隔" aria-label="自动刷新间隔">
                    <option value="30">30s</option>
                    <option value="60">60s</option>
                    <option value="120" selected>120s</option>
                    <option value="300">300s</option>
                </select>
            </div>
            <button id="columnConfigBtn" class="header-icon-btn" title="列显示设置" aria-label="列显示设置" aria-expanded="false"
                type="button">⚙️</button>
            <div id="columnConfigPanel" role="dialog" aria-label="列显示设置"></div>
            <button id="fullscreenBtn" class="header-icon-btn" title="全屏查看" aria-label="全屏查看" type="button">⛶</button>
        </div>
    </div>



    <div class="fab-container">
        <div class="fab-menu" id="fabMenu">
            <button class="fab-item" id="fabSelectAll"><span class="fab-icon">☑️</span><span class="fab-label">全选 /
                    取消全选</span></button>
            <button class="fab-item" id="fabAdd"><span class="fab-icon">➕</span><span
                    class="fab-label">添加资产</span></button>
            <button class="fab-item" id="fabOCRBatch"><span class="fab-icon">📷</span><span
                    class="fab-label">图片识别批量添加</span></button>
            <button class="fab-item" id="fabBatchCalc"><span class="fab-icon">🔄</span><span
                    class="fab-label">批量重算份额</span></button>
            <button class="fab-item" id="fabBatchDel"><span class="fab-icon">🗑</span><span
                    class="fab-label">批量删除</span></button>
            <button class="fab-item" id="fabSettlement"><span class="fab-icon">📅</span><span
                    class="fab-label">触发日结算</span></button>
            <button class="fab-item" id="fabRollback" style="display:none;"><span class="fab-icon">↩</span><span
                    class="fab-label">撤销日结算</span></button>
            <button class="fab-item" id="fabBatchGroup"><span class="fab-icon">📁</span><span
                    class="fab-label">批量修改分组</span></button>
            <button class="fab-item" id="fabBatchClear"><span class="fab-icon">🧹</span><span
                    class="fab-label">批量清空持仓</span></button>
            <button class="fab-item" id="fabExport"><span class="fab-icon">📤</span><span
                    class="fab-label">导出当前数据</span></button>
            <button class="fab-item" id="fabExportBackup"><span class="fab-icon">🗂</span><span
                    class="fab-label">导出备份数据</span></button>
            <button class="fab-item" id="fabImport"><span class="fab-icon">📥</span><span
                    class="fab-label">导入数据</span></button>
        </div>
        <div class="fab-main" id="fabMain">
            <span>⚡</span>
        </div>
    </div>

    <!-- 统计栏 -->
    <div class="summary-bar">
        <div class="summary-item"><span class="summary-label">总资产</span><b id="totalAmount">0.00</b></div>
        <div class="summary-item"><span class="summary-label">昨日收益</span><b id="totalYesterdayProfit">0.00</b></div>
        <div class="summary-item"><span class="summary-label">当日估值</span><b id="totalTodayProfit">0.00</b></div>
        <div class="summary-item"><span class="summary-label">累计收益</span><b id="totalTotalProfit">0.00</b></div>
    </div>

    <div class="filter-bar">
        <div class="filter-left">
            <label class="filter-label">筛选分组</label>
            <select id="groupFilter">
                <option value="all">全部显示</option>
            </select>
            <datalist id="groupList"></datalist>
        </div>
        <div id="filterBreadth" class="filter-breadth">
            <!-- 广度数据由 JS 动态渲染 -->
        </div>
        <button id="indexSettingsBtn" class="index-settings-btn" title="指数设置">⚙</button>
        <button id="profitCalendarBtn" class="filter-action-btn">收益日历</button>
    </div>

    <!-- 所有操作按钮通过悬浮球 FAB 访问，以下为隐藏的功能性元素 -->
    <input type="file" id="importFile" accept=".json" style="display:none;">
    <!-- 以下按钮隐藏，仅作 JS 绑定用（逻辑由 FAB 触发） -->
    <button id="addBtn" style="display:none;"></button>
    <button id="exportBtn" style="display:none;"></button>
    <button id="importBtn" style="display:none;"></button>
    <button id="settlementBtn" style="display:none;"></button>
    <button id="rollbackBtn" style="display:none;"></button>
    <button id="batchGroupBtn" style="display:none;"></button>
    <button id="batchClearBtn" style="display:none;"></button>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th data-col="index">序号</th>
                    <th class="sortable" data-sort="code" data-col="code">代码</th>
                    <th data-col="name">名称/分组</th>
                    <th class="sortable" data-sort="amount" data-col="amount">持仓</th>
                    <th class="sortable col-hide" data-sort="shares" data-col="shares">份额</th>
                    <th class="sortable col-hide" data-sort="prevPrice" data-col="nav">净值</th>
                    <th class="col-hide" data-col="holdDays">持有天数</th>
                    <th class="col-hide" data-col="w1">近1周</th>
                    <th class="col-hide" data-col="m1">近1月</th>
                    <th class="col-hide" data-col="m3">近3月</th>
                    <th class="col-hide" data-col="m6">近6月</th>
                    <th class="col-hide" data-col="y1">近1年</th>
                    <th class="col-hide" data-col="ly">成立以来</th>
                    <th class="sortable" data-sort="yesterdayProfit" data-col="yesterdayProfit">昨日收益</th>
                    <th class="sortable" data-sort="todayProfit" data-col="todayProfit">估值收益</th>
                    <th class="sortable" data-sort="holdProfit" data-col="holdProfit">累计收益</th>
                    <th class="col-hide" data-col="actions">操作</th>
                </tr>
            </thead>
            <tbody id="fundTableBody"></tbody>
        </table>
    </div>

    <div id="status">
        <span id="statusText">准备就绪</span>
        <span id="selectionStatus" style="display:none;"></span>
    </div>

    <!-- Toast 容器 -->
    <div id="toastContainer"></div>

    <!-- 通用 Modal 弹窗 -->
    <div id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-box" role="document">
            <div class="modal-title" id="modalTitle">提示</div>
            <div class="modal-msg" id="modalMsg"></div>
            <input class="modal-input" id="modalInput" type="text" style="display:none;">
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- 基金详情弹窗 -->
    <div class="fund-detail-overlay" id="fundDetailOverlay">
        <div class="fund-detail-box">
            <div class="fund-detail-header">
                <div class="fund-detail-title" id="fundDetailTitle">基金详情</div>
                <div class="fund-detail-actions">
                    <div class="fund-detail-fit-btn" id="fundDetailFitBtn" title="贴合页面大小">贴合页面</div>
                    <div class="fund-detail-close" id="fundDetailClose">✕</div>
                </div>
            </div>
            <div class="fund-detail-content" id="fundDetailContent" style="position:relative;">
                <div class="detail-loading">加载中...</div>
            </div>
        </div>
    </div>

    <!-- OCR 主线程模式：先加载 core，再加载改造后的 worker（暴露 __TesseractDispatch） -->
    <script src="tesseract-core.wasm.js"></script>
    <script src="worker.min.js"></script>
    <script src="tesseract.min.js"></script>
    <script src="popup.js"></script>
</body>

</html>
